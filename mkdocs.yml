site_name: Juit Jurisprudence .NET SDK
site_description: SDK .NET fortemente tipado para busca de jurisprudências na Juit, mantido pela loud-technology.
site_url: https://loud-technology.github.io/loud-technology-juit-sdk/
repo_url: https://github.com/loud-technology/loud-technology-juit-sdk
repo_name: loud-technology/loud-technology-juit-sdk
edit_uri: edit/main/docs/

nav:
  - Visão geral: index.md
  - Primeiros passos: getting-started.md
  - Guias:
      - Configuração do cliente: guides/configuration.md
      - Publicação de releases: guides/release-publishing.md
# EXAMPLES:START
# EXAMPLES:END

theme:
  name: material
  language: pt-BR
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Usar tema claro

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
